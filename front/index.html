<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Pacientes</title>
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tu hoja de estilos personalizada -->
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body
    class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col"
  >
    <!-- Navbar Superior -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
      <div
        class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-9 h-9 rounded-lg bg-teal-600 text-white flex items-center justify-center font-bold shadow-sm"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              />
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold text-slate-900 leading-tight">
              Control de Pacientes
            </h1>
            <p class="text-xs text-slate-500">Consumo de API</p>
          </div>
        </div>

        <!-- Botón Nuevo Paciente (Abre Modal) -->
        <button
          onclick="abrirModalCrear()"
          class="inline-flex items-center gap-2 bg-teal-600 hover:bg-teal-700 active:scale-95 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-sm transition-all cursor-pointer"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
          Nuevo Paciente
        </button>
      </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Encabezado de sección y buscador visual -->
      <div
        class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6"
      >
        <div>
          <h2 class="text-2xl font-bold text-slate-900">
            Directorio de Pacientes
          </h2>
          <p class="text-sm text-slate-500 mt-0.5">Administra los registros.</p>
        </div>

        <div class="relative w-full sm:w-72">
          <input
            type="text"
            id="buscador"
            placeholder="Buscar por ID."
            class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 transition-all"
          />
          <svg
            class="w-4 h-4 text-slate-400 absolute left-3.5 top-2.5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </div>
      </div>

      <!-- Tarjeta Contenedora de la Tabla -->
      <div
        class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden"
      >
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-slate-50/80 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider"
              >
                <th class="py-3.5 px-6">ID</th>
                <th class="py-3.5 px-6">Paciente</th>
                <th class="py-3.5 px-6">Edad</th>
                <th class="py-3.5 px-6">Género</th>
                <th class="py-3.5 px-6">Diagnóstico</th>
                <th class="py-3.5 px-6 text-right">Acciones</th>
              </tr>
            </thead>
            <tbody
              id="tabla-pacientes"
              class="divide-y divide-slate-100 text-sm"
            >
              <!-- Filas generadas dinámicamente desde app.js -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- ========================================== -->
    <!-- MODAL 1: CREAR / ACTUALIZAR PACIENTE       -->
    <!-- ========================================== -->
    <div
      id="modal-formulario"
      class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs"
    >
      <div
        class="modal-caja bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-md overflow-hidden"
      >
        <!-- Cabecera del Modal -->
        <div
          class="px-6 py-4 border-b border-slate-100 flex items-center justify-between"
        >
          <h3 id="modal-titulo" class="text-lg font-bold text-slate-900">
            Registrar Paciente
          </h3>
          <button
            onclick="cerrarModalFormulario()"
            class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- Formulario -->
        <form id="form-paciente" class="p-6 space-y-4">
          <!-- Campo oculto para el ID al actualizar -->
          <input type="hidden" id="paciente-id" name="id" />

          <div>
            <label
              for="name"
              class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5"
              >Nombre Completo</label
            >
            <input
              type="text"
              id="name"
              name="name"
              required
              placeholder="Ej. Laura Gómez"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 transition-all"
            />
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                for="age"
                class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5"
                >Edad</label
              >
              <input
                type="number"
                id="age"
                name="age"
                required
                min="0"
                max="120"
                placeholder="Ej. 28"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 transition-all"
              />
            </div>

            <div>
              <label
                for="gender"
                class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5"
                >Género</label
              >
              <select
                id="gender"
                name="gender"
                required
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 transition-all"
              >
                <option value="" disabled selected>Seleccionar...</option>
                <option value="F">Femenino</option>
                <option value="M">Masculino</option>
                <option value="O">Otro</option>
              </select>
            </div>
          </div>

          <div>
            <label
              for="diagnosis"
              class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5"
              >Diagnóstico</label
            >
            <textarea
              id="diagnosis"
              name="diagnosis"
              rows="3"
              required
              placeholder="Describe el diagnóstico médico..."
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 transition-all resize-none"
            ></textarea>
          </div>

          <!-- Botones del Formulario -->
          <div class="pt-2 flex items-center justify-end gap-3">
            <button
              type="button"
              onclick="cerrarModalFormulario()"
              class="px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer"
            >
              Cancelar
            </button>
            <button
              type="submit"
              id="btn-guardar"
              class="px-5 py-2.5 text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 active:scale-95 rounded-xl shadow-sm transition-all cursor-pointer"
            >
              Guardar Paciente
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL 2: CONFIRMACIÓN DE ELIMINAR          -->
    <!-- ========================================== -->
    <div
      id="modal-eliminar"
      class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs"
    >
      <div
        class="modal-caja bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-sm p-6 text-center"
      >
        <div
          class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>

        <h3 class="text-lg font-bold text-slate-900">¿Eliminar paciente?</h3>
        <p class="text-sm text-slate-500 mt-1.5">
          Estás a punto de eliminar a
          <span id="nombre-eliminar" class="font-semibold text-slate-800"></span
          >. Esta acción no se puede deshacer.
        </p>

        <div class="mt-6 flex items-center justify-center gap-3">
          <button
            type="button"
            onclick="cerrarModalEliminar()"
            class="flex-1 px-4 py-2.5 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors cursor-pointer"
          >
            Cancelar
          </button>
          <button
            type="button"
            id="btn-confirmar-eliminar"
            class="flex-1 px-4 py-2.5 text-sm font-medium text-white bg-rose-600 hover:bg-rose-700 active:scale-95 rounded-xl shadow-sm transition-all cursor-pointer"
          >
            Sí, eliminar
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
